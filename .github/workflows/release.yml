name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: rustcooling-windows-x64
          path: target/release/rustcooling.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Build Release
        run: cargo build --release
      - name: Install cargo-deb
        run: cargo install cargo-deb
      - name: Build Debian Package
        run: cargo deb --no-build
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: rustcooling-linux-x64
          path: target/release/rustcooling
      - name: Upload Deb Package
        uses: actions/upload-artifact@v4
        with:
          name: rustcooling-deb
          path: target/debian/*.deb

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare Assets
        run: |
          mkdir -p release_assets
          cp artifacts/rustcooling-windows-x64/rustcooling.exe release_assets/rustcooling-windows-x64.exe
          cp artifacts/rustcooling-linux-x64/rustcooling release_assets/rustcooling-linux-x64
          chmod +x release_assets/rustcooling-linux-x64
          cp artifacts/rustcooling-deb/*.deb release_assets/
          cd release_assets && sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
